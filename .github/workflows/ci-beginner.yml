name: Portfolio CI (Beginner)

# Trigger the workflow on pushes or pull requests to the master branch
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint-and-build:
    name: Lint & Build Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      # Step 3: Install dependencies using npm ci (clean install for speed and reproducibility)
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run ESLint check
      - name: Run Linter
        run: npm run lint

      # Step 5: Build Next.js application to check for compilation errors
      - name: Build Project
        run: npm run build
